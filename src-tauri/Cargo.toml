[package]
name = "markdown-mode"
version = "0.1.8"
description = "A focused macOS Markdown review app"
authors = ["Markdown Mode"]
edition = "2021"

[lib]
name = "markdown_mode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
